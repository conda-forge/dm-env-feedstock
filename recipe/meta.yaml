{% set version = "2.0" %}

package:
  name: dm-env
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/d/dm-env/dm_env-{{ version }}.tar.gz
  sha256: 4c018f684cd4173028c8a08eb1f62548a1eaf9b6a573b21461c86f6977369e72

build:
  number: 0
  noarch: python
  script:
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - absl-py
    - dm-tree
    - numpy
    - python >={{ python_min }}

test:
  requires:
    - pip
    - pytest-cov
    - python {{ python_min }}
  imports:
    - dm_env
  commands:
    - pip check
    - pytest -vv --pyargs dm_env --cov=dm_env --cov-report=term-missing:skip-covered --cov-fail-under=98

about:
  home: https://pypi.org/project/dm-env
  summary: A Python interface for Reinforcement Learning environments.
  license: Apache-2.0
  license_file: LICENSE
  dev_url: https://github.com/deepmind/dm_env
  doc_url: https://github.com/deepmind/dm_env/blob/{{ version }}/docs/index.md

extra:
  recipe-maintainers:
    - bollwyvl
